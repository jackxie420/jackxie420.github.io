<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup Hangman · Haopeng (Jack) Xie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f9fd; --card: #fff; --text: #1d2939; --muted: #5b6b80; --line: #dde8f3;
      --blue: #2f86d4; --blue-dark: #1f6db3; --blue-soft: #e6f1fc;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: var(--blue); text-decoration: none; }

    .topnav {
      position: sticky; top: 0; z-index: 20;
      background: rgba(245, 249, 253, .85);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topnav .inner {
      max-width: 1040px; margin: 0 auto; padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .brand { font-weight: 700; color: var(--text); font-size: 1.02rem; white-space: nowrap; }
    .brand:hover { color: var(--blue); }
    .topnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .topnav ul::-webkit-scrollbar { display: none; }
    .topnav ul a { display: block; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: .92rem; font-weight: 500; white-space: nowrap; }
    .topnav ul a:hover, .topnav ul a.active { color: var(--blue-dark); background: var(--blue-soft); }

    .game-page { max-width: 720px; margin: 0 auto; padding: 36px 20px 56px; }
    .back { font-size: .9rem; font-weight: 500; }
    .game-page h1 { font-size: 1.8rem; margin: 12px 0 4px; }
    .intro { color: var(--muted); margin: 0 0 24px; }

    .hangman-container {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 28px 24px; display: flex; flex-direction: column; align-items: center;
    }
    .game-top { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
    .image-container img { width: 180px; height: 180px; object-fit: cover; border-radius: 12px; display: block; }
    .caption { margin-top: 6px; font-size: .82rem; color: var(--muted); text-align: center; }
    .hangman-drawing { width: 120px; height: 180px; display: flex; align-items: flex-end; justify-content: center; }
    .hangman-part { stroke: var(--blue-dark); stroke-width: 4px; stroke-linecap: round; fill: none; opacity: 0; transition: opacity .3s; }
    .hangman-part.visible { opacity: 1; }

    .guesses-left {
      font-size: .9rem; font-weight: 600; color: var(--blue-dark);
      background: var(--blue-soft); padding: 4px 14px; border-radius: 999px; margin: 8px 0 18px;
    }
    .word {
      font-size: 2rem; font-weight: 600; letter-spacing: .45rem; margin-bottom: 22px;
      font-family: ui-monospace, Menlo, 'Courier New', monospace; text-align: center; word-break: break-all;
    }
    .letters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; justify-content: center; max-width: 520px; }
    .letter-btn {
      width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--text); font: 600 1rem var(--sans);
      cursor: pointer; transition: background .15s, border-color .15s, color .15s;
    }
    .letter-btn:hover:not(:disabled) { background: var(--blue-soft); border-color: #a9cff2; color: var(--blue-dark); }
    .letter-btn:disabled { background: #eef2f6; color: #b3bdc9; cursor: not-allowed; }
    .incorrect-letters { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; justify-content: center; margin-bottom: 8px; }
    .incorrect-box {
      background: #fdecec; color: #c0392b; border: 1px solid #f5c2c0;
      border-radius: 6px; padding: 2px 9px; font: 600 .9rem ui-monospace, Menlo, monospace;
    }
    .game-message { font-size: 1.15rem; font-weight: 600; color: var(--blue-dark); min-height: 30px; text-align: center; }
    .restart-btn {
      margin-top: 14px; padding: 9px 22px; font: 600 .95rem var(--sans);
      border-radius: 8px; border: none; background: var(--blue); color: #fff; cursor: pointer; transition: background .2s;
    }
    .restart-btn:hover { background: var(--blue-dark); }

    @media (max-width: 820px) {
      .topnav .inner { height: auto; padding-top: 10px; padding-bottom: 8px; flex-direction: column; align-items: stretch; gap: 4px; }
      .topnav ul { margin: 0 -12px; }
    }
    @media (max-width: 480px) {
      .image-container img { width: 140px; height: 140px; }
      .word { font-size: 1.5rem; letter-spacing: .3rem; }
      .letter-btn { width: 34px; height: 34px; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="inner">
      <a class="brand" href="../../">Haopeng (Jack) Xie</a>
      <ul>
        <li><a href="../../">Home</a></li>
        <li><a href="../../research/">Research &amp; Publications</a></li>
        <li><a href="../../experience/">Experience</a></li>
        <li><a href="../" class="active">Fun Projects</a></li>
      </ul>
    </div>
  </nav>

  <main class="game-page">
    <a class="back" href="../">← All fun projects</a>
    <h1>World Cup Hangman</h1>
    <p class="intro">Guess the football-themed word one letter at a time. You have 12 wrong guesses.</p>

    <div class="hangman-container">
      <div class="game-top">
        <div class="image-container">
          <img src="assets/images/emi-martinez-save.jpg" alt="Emi Martínez making a save">
          <div class="caption">Emi Martínez's legendary save</div>
        </div>
        <div id="hangmanDrawing" class="hangman-drawing"></div>
      </div>
      <div class="guesses-left" id="guessesLeft"></div>
      <div class="word" id="wordDisplay"></div>
      <div class="letters" id="letterButtons"></div>
      <div class="incorrect-letters" id="incorrectLetters"></div>
      <div class="game-message" id="gameMessage"></div>
      <button class="restart-btn" id="restartBtn" style="display:none;">Play again</button>
    </div>
  </main>
  <script type="module">
    import { WORDS } from './assets/js/words.js';

    const HANGMAN_PARTS = [
      // Gallows (5 parts)
      'base', 'pole', 'beam', 'rope', 'support',
      // Body (7 parts)
      'head', 'body', 'leftArm', 'rightArm', 'leftLeg', 'rightLeg', 'face'
    ];
    const MAX_PARTS = 12; // 5 gallows + 7 body

    let chosenWord = '';
    let correctGuesses = [];
    let incorrectGuesses = [];
    let guessesLeft = 12;
    let gameOver = false;

    const wordDisplay = document.getElementById('wordDisplay');
    const letterButtons = document.getElementById('letterButtons');
    const incorrectLetters = document.getElementById('incorrectLetters');
    const guessesLeftDiv = document.getElementById('guessesLeft');
    const gameMessage = document.getElementById('gameMessage');
    const restartBtn = document.getElementById('restartBtn');
    const hangmanDrawing = document.getElementById('hangmanDrawing');

    function renderHangman(incorrectCount) {
      // SVG with 12 parts, each with class hangman-part and unique id
      const showHead = incorrectCount > 5;
      const showBody = incorrectCount > 6;
      const showLeftArm = incorrectCount > 7;
      const showRightArm = incorrectCount > 8;
      const showLeftLeg = incorrectCount > 9;
      const showRightLeg = incorrectCount > 10;
      // Gallows
      const showBase = incorrectCount > 0;
      const showPole = incorrectCount > 1;
      const showBeam = incorrectCount > 2;
      const showRope = incorrectCount > 3;
      const showSupport = incorrectCount > 4;
      // Face (Eric image)  
      const ericImg = showHead ? `<image href='assets/images/eric.png' x='53' y='28' width='54' height='54' class='hangman-face${showHead ? ' visible' : ''}' style='opacity:${showHead ? 1 : 0};transition:opacity 0.3s;' />` : '';
      const svg = `
        <svg width="120" height="180" viewBox="0 0 120 180">
          <defs>
            <clipPath id="ericClip">
              <circle cx="80" cy="55" r="15" />
            </clipPath>
          </defs>
          <!-- Gallows -->
          <line x1="10" y1="170" x2="110" y2="170" class="hangman-part${showBase?' visible':''}" id="base" />
          <line x1="30" y1="170" x2="30" y2="20" class="hangman-part${showPole?' visible':''}" id="pole" />
          <line x1="30" y1="20" x2="80" y2="20" class="hangman-part${showBeam?' visible':''}" id="beam" />
          <line x1="80" y1="20" x2="80" y2="40" class="hangman-part${showRope?' visible':''}" id="rope" />
          <line x1="30" y1="50" x2="60" y2="20" class="hangman-part${showSupport?' visible':''}" id="support" />
          <!-- Body -->
          <line x1="80" y1="70" x2="80" y2="110" class="hangman-part${showBody?' visible':''}" id="body" />
          <!-- Left Arm -->
          <line x1="80" y1="80" x2="60" y2="95" class="hangman-part${showLeftArm?' visible':''}" id="leftArm" />
          <!-- Right Arm -->
          <line x1="80" y1="80" x2="100" y2="95" class="hangman-part${showRightArm?' visible':''}" id="rightArm" />
          <!-- Left Leg -->
          <line x1="80" y1="110" x2="65" y2="140" class="hangman-part${showLeftLeg?' visible':''}" id="leftLeg" />
          <!-- Right Leg -->
          <line x1="80" y1="110" x2="95" y2="140" class="hangman-part${showRightLeg?' visible':''}" id="rightLeg" />
          <!-- Head (Eric image on top) -->
          ${ericImg}
        </svg>
      `;
      hangmanDrawing.innerHTML = svg;
    }

    function pickWord() {
      const idx = Math.floor(Math.random() * WORDS.length);
      return WORDS[idx].toUpperCase();
    }

    function displayWord() {
      let display = '';
      for (let letter of chosenWord) {
        if (correctGuesses.includes(letter)) {
          display += letter + ' ';
        } else {
          display += '_ ';
        }
      }
      wordDisplay.textContent = display.trim();
    }

    function createLetterButtons() {
      letterButtons.innerHTML = '';
      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const btn = document.createElement('button');
        btn.textContent = letter;
        btn.className = 'letter-btn';
        btn.disabled = correctGuesses.includes(letter) || incorrectGuesses.includes(letter) || gameOver;
        btn.onclick = () => handleGuess(letter);
        letterButtons.appendChild(btn);
      }
    }

    function displayIncorrectGuesses() {
      incorrectLetters.innerHTML = '';
      for (let letter of incorrectGuesses) {
        const box = document.createElement('span');
        box.className = 'incorrect-box';
        box.textContent = letter;
        incorrectLetters.appendChild(box);
      }
    }

    function updateGuessesLeft() {
      guessesLeftDiv.textContent = `Guesses left: ${guessesLeft}`;
    }

    function handleGuess(letter) {
      if (gameOver) return;
      if (chosenWord.includes(letter)) {
        correctGuesses.push(letter);
      } else {
        if (!incorrectGuesses.includes(letter)) {
          incorrectGuesses.push(letter);
          guessesLeft--;
        }
      }
      checkGameStatus();
      displayWord();
      createLetterButtons();
      displayIncorrectGuesses();
      updateGuessesLeft();
      renderHangman(incorrectGuesses.length);
    }

    function checkGameStatus() {
      let won = true;
      for (let letter of chosenWord) {
        if (!correctGuesses.includes(letter)) {
          won = false;
          break;
        }
      }
      if (won) {
        gameMessage.textContent = '🎉 You Win! The word was: ' + chosenWord;
        gameOver = true;
        restartBtn.style.display = 'inline-block';
      } else if (guessesLeft <= 0) {
        gameMessage.textContent = '😢 Game Over! The word was: ' + chosenWord;
        gameOver = true;
        restartBtn.style.display = 'inline-block';
      } else {
        gameMessage.textContent = '';
      }
    }

    function restartGame() {
      chosenWord = pickWord();
      correctGuesses = [];
      incorrectGuesses = [];
      guessesLeft = 12;
      gameOver = false;
      restartBtn.style.display = 'none';
      gameMessage.textContent = '';
      displayWord();
      createLetterButtons();
      displayIncorrectGuesses();
      updateGuessesLeft();
      renderHangman(0);
    }

    restartBtn.onclick = restartGame;

    // Start game on load
    restartGame();
  </script>
</body>
</html>
